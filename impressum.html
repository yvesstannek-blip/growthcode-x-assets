<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum — Automated Content System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d; --surface: #141417; --border: #26262b;
    --text: #f5f5f0; --text-muted: #9a9a9f;
    --accent: #c9a24b; --accent-ink: #0b0b0d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 80px 24px 100px; }
  .eyebrow {
    font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif; font-size: 36px; font-weight: 600;
    line-height: 1.2; margin: 0 0 40px;
  }
  h2 {
    font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent); margin: 36px 0 12px;
  }
  p { font-size: 16px; color: var(--text-muted); margin: 0 0 6px; }
  a { color: var(--text); }
  .back {
    display: inline-block; margin-top: 48px; font-size: 14px; color: var(--text-muted);
    text-decoration: none; border-top: 1px solid var(--border); padding-top: 24px; width: 100%;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Rechtliches</div>
  <h1>Impressum</h1>

  <h2>Angaben gemäß § 5 TMG</h2>
  <p>Yves Stannek</p>
  <p>Am Schipperberg 7</p>
  <p>21279 Wenzendorf</p>
  <p>Deutschland</p>

  <h2>Kontakt</h2>
  <p>Telefon: 01746959781</p>
  <p>E-Mail: <a href="mailto:yves.stannek@gmx.net">yves.stannek@gmx.net</a></p>

  <h2>Verantwortlich für den Inhalt</h2>
  <p>Yves Stannek (Anschrift wie oben)</p>

  <a class="back" href="index.html">&larr; Zurück zur Startseite</a>
</div>

</body>
</html>
